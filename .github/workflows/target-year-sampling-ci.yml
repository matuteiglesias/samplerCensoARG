name: Target-year sampling CI

on:
  pull_request:
    paths:
      - .github/workflows/target-year-sampling-ci.yml
      - censo_sampler/target_year.py
      - censo_sampler/cli.py
      - tests/test_target_year_sampling.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/target-year-sampling-ci.yml
      - censo_sampler/target_year.py
      - censo_sampler/cli.py
      - tests/test_target_year_sampling.py

permissions:
  contents: read

jobs:
  target-year:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded test tools
        run: python -m pip install pytest ruff
      - name: Lint target-year boundary
        run: ruff check censo_sampler/target_year.py tests/test_target_year_sampling.py
      - name: Verify target-year boundary
        run: pytest -q tests/test_target_year_sampling.py
